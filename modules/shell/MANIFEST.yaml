# Machine-readable source of truth for the module.
# Read by: humans (onboarding), agents (scoping), CI (fitness functions).
# Any divergence between this file and the code fails CI.

module:
  name: "shell"

  # ONE sentence. If it needs an "and", the module probably does two things.
  responsibility: >
    Puts Wholeheard's four steps in the user's hands: a tray, a global shortcut, notifications, one window.

  owner: "NapkinStack/maintainers"          # a GitHub team, organisation/team; a user only without an organisation
  contact: "@NapkinStack/maintainers"

  # proposed | active | maintenance | deprecated | retired   (.nstack/handbook/02-modules.md §6)
  lifecycle: active

  # What does a failure of this module cost? nothing, thrown away | a user's patience |
  # a day of work | a key, an order, money, personal data. The decider settles it; what
  # each value requires is the table in .nstack/handbook/05-workflow.md §7.
  # prototype | standard | high | critical
  criticality: "standard"

  # Does a user see this module? true requires a test sheet on its pull requests from
  # standard up (.nstack/handbook/05-workflow.md §7).
  user_facing: true

  # The module's name in the code, when it differs from the folder (package, namespace).
  # Used by boundary detection.
  # code_name: shell

  # Only when lifecycle = deprecated. The check turns red once the date has passed.
  # deprecation:
  #   replaced_by:
  #   removal_date: YYYY-MM-DD

# Contracts PROVIDED by this module. `path` holds its document (B7).
provides: []
#  - contract: shell-api
#    version: v1
#    path: contracts/shell-api/v1
#    stability: experimental      # experimental | stable | deprecated
#    # removal_date: YYYY-MM-DD   # required when stability = deprecated

# Contracts CONSUMED - this is the DECLARED graph.
# CI compares it with the contracts this module's files read: one read and not declared
# fails (B1), one declared and never read is reported (B4), one nobody provides fails (B6).
consumes:
  - contract: recording
    version: v1
    module: capture
  - contract: transcript
    version: v1
    module: transcription
  - contract: session-audio
    version: v1
    module: capture
  - contract: session-audio
    version: v2
    module: capture
  - contract: minutes
    version: v1
    module: summary
  - contract: minutes
    version: v2
    module: summary
  - contract: summarising
    version: v1
    module: summary
#  - contract: identity-api
#    version: v1
#    module: identity

# Data owned. Nobody else accesses it directly.
data:
  owns: []
  shared: []                     # any exception requires a named ADR

# Significant external dependencies.
# Each one declares its exit strategy (.nstack/handbook/06-decisions.md §3).
dependencies:
  - name: chrono
    purpose: When a person corrected a transcript's line, written with its offset as the minutes' made is (D62)
    adr: docs/adr/0014-a-transcript-line-corrected-in-place-once-complete.md
    exit_strategy: One call in transcript_corrected, src/main.rs; any clock that formats RFC 3339 replaces it.
  - name: serde_json
    purpose: Reads the lines a step's program prints, and the logs' lines a meeting's diagnostic gathers
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One reader of lines in src/recording.rs and one in log::diagnostic; any JSON library replaces it.
  - name: toml
    purpose: Reads the settings file, a few lines the user can write by hand
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One call in src/settings.rs, behind serde; another format is another reader of the same struct.
  - name: toml_edit
    purpose: Writes the settings file again keeping the user's comments and the keys it does not know
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One function, write, in src/settings.rs; writing the whole file anew replaces it, losing comments.
  - name: keyring-core
    purpose: Keeps a provider's key in the system's keyring, never in a file — with its store for each system
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: >
      Three functions and the store's opening in src/keys.rs; secret-tool, the Keychain and the
      Credential Manager's own interfaces replace it.
  - name: trash
    purpose: Moves the audio kept longer than the settings say to the system's trash, never deleting it
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: >
      One call, trash::delete_all, in src/main.rs; gio trash and the systems' own trash
      interfaces replace it.
  - name: http
    purpose: Reads a provider's address as wholeheard-summary does, to tell one of this machine
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: >
      One parse, in providers::local; any reader of addresses wholeheard-summary also uses replaces it.
  - name: tauri-plugin-dialog
    purpose: Opens the system's own dialog to choose the sessions' folder
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: >
      One call, blocking_pick_folder, in src/main.rs; rfd, which it wraps, or the folder typed
      in the page replace it.
  - name: dirs
    purpose: Names the user's configuration and documents folders, on the three systems
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: Three calls in src/settings.rs; environment variables replace it on Linux.
  - name: tauri
    purpose: The tray, its menu, the application's life, and the window in the system's own web view
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: >
      src/main.rs and the page in ui/ alone know it; the library beside it holds every
      decision and knows no toolkit.
  - name: tauri-plugin-single-instance
    purpose: "One Wholeheard per session — a second start hands its arguments to the running one and leaves (D35, #386)"
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: >
      One plugin and its callback in src/main.rs; a lock file and a socket, or the session bus's
      own name ownership, replace it.
  - name: tauri-plugin-notification
    purpose: Shows a notification on the three systems
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One function, tell, in src/main.rs.
  - name: ashpd
    purpose: Asks a Linux desktop's portal for the global shortcut (ADR-0002)
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One function, bound, in src/main.rs; elsewhere tauri-plugin-global-shortcut does it.
  - name: libc
    purpose: Ends a transcript with what its program started, by signalling its process group, on Linux and macOS
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One call in src/transcription.rs; the `kill` command, or nix, replaces it.
  - name: notify-rust
    purpose: A notification whose click opens the session's folder, under Linux; the toolkit's plugin tells no click
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One function, tell_opening, in src/main.rs; the toolkit's plugin, the day it tells a click.
  - name: ureq
    purpose: Fetches the default model, on the user's word, from where its authors publish it
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One function, receive, in src/model.rs; any HTTP client that sends a Range.
  - name: sha2
    purpose: Checks a fetched model against its published SHA-256 before it is used
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One function, fingerprint, in src/model.rs; any SHA-256.
  - name: pulldown-cmark
    purpose: Renders a session's minutes from CommonMark, the reader wholeheard-summary judged them with
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: >
      One function, parse_minutes, in src/minutes.rs; any CommonMark renderer whose events let
      raw HTML and links be turned to text.
  - name: sys-locale
    purpose: Reads the language the user's system is set to, on the three systems
    adr: docs/adr/0002-a-rust-core-of-programs-and-a-web-view-shell.md
    exit_strategy: One call in src/words.rs; the environment replaces it on Linux, a system call elsewhere.
  - name: hyper
    purpose: >
      The loopback server the window plays an opened meeting from, its tracks alone (D26), with
      hyper-util, http-body-util, bytes, futures-util and tokio — all already among Tauri's own
      dependencies
    adr: docs/adr/0008-the-window-plays-a-meeting-from-a-loopback-server.md
    exit_strategy: >
      src/player.rs alone: serve and answer; any HTTP server that bounds a request's headers,
      never reads a body and caps the connections held replaces them.
  - name: rubato
    purpose: >
      Brings a track of a lower rate up to the mix's, for the window's player (ADR-0009) — the
      resampler the transcription already uses, same version
    adr: docs/adr/0009-the-window-plays-a-meeting-s-tracks-as-one-sound.md
    exit_strategy: One function, mix::Track::raised; any resampler of fixed ratio replaces it.
  - name: getrandom
    purpose: The loopback server's token, 128 random bits from the system
    adr: docs/adr/0008-the-window-plays-a-meeting-from-a-loopback-server.md
    exit_strategy: One call in player::Served::start; the system's own source (/dev/urandom) replaces it.
  - name: tracing
    purpose: The steps and failures the shell logs, each making under its id (ADR-0007)
    adr: docs/adr/0007-each-program-logs-what-it-does-never-what-was-said.md
    exit_strategy: >
      The info! and error! calls of src/main.rs, src/recording.rs, src/transcription.rs and
      src/summarising.rs; any logging facade replaces them.
  - name: tracing-subscriber
    purpose: Writes those events as JSON lines, at the level asked
    adr: docs/adr/0007-each-program-logs-what-it-does-never-what-was-said.md
    exit_strategy: One function, start in src/log.rs.
  - name: tracing-appender
    purpose: A file a day
    adr: docs/adr/0007-each-program-logs-what-it-does-never-what-was-said.md
    exit_strategy: One function, start in src/log.rs.
#  - name:
#    purpose:
#    adr:
#    exit_strategy:

# Standard verbs: the same names everywhere, running this module's stack commands
# (.nstack/handbook/09-platform.md §2). `nstack <verb> <module>` runs them from this folder.
# No stack is imposed. check and test are required once the module holds more than its
# description (fitness M7): declare them before its first file of code.
commands:
  bootstrap: bash scripts/bootstrap.sh
  # The page's script read for its syntax where Node is there (the hosted runners have it): a
  # name declared twice in one scope blanks the whole window, which only the e2e saw (D42).
  check: >-
    bash -n scripts/release.sh && { ! command -v node >/dev/null || node --check ui/window.js; }
    && cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings
  test: cargo test --locked
  run: cargo run --locked --release --bin wholeheard
  release: bash scripts/release.sh
  e2e: bash scripts/e2e.sh
  clean: cargo clean

# Each warning or error a scenario of the e2e provokes on purpose, as its log line says it (D29).
# Any other warning or error logged fails the run, and so does one declared and never logged
# (scripts/e2e_logs.py); NapkinStack audits the same logs, in $NSTACK_EVIDENCE (M12).
evidence:
  provoked:
    # The played recorder says the output has no device left (D31), at each of its starts: A, B, C, F, G, M, S;
    # and the window's Q, when it asks (D33).
    - pattern: '"message":"shell\.recording_lost"'
      level: warning
      scenario: A
    # The window's AN starts a recording with no microphone to open, its side said waiting (D49).
    - pattern: '"message":"shell\.recording_unavailable"'
      level: warning
      scenario: AN
    # No recorder where Wholeheard looks for one.
    - pattern: '"message":"shell\.recording_failed"'
      level: error
      scenario: D
    # The played engine fails once; the window's N has a transcript redone that fails; the window's AA
    # ends a service hearing a meeting said confidential (D60).
    - pattern: '"message":"shell\.transcript_failed"'
      level: error
      scenario: F
    # The window's Z tests a model that gives no segment times: refused, as the step says it (D43, D63).
    - pattern: '"message":"shell\.transcription_test_failed"'
      level: warning
      scenario: Z
    # What is fetched is not the published model, and is removed.
    - pattern: '"message":"shell\.model_fetch_failed"'
      level: error
      scenario: G
    # The list of models read again answers a page not found, refused (the window's W, D40).
    - pattern: '"message":"shell\.registry_refused"'
      level: warning
      scenario: W
    # Ollama's pull of the minutes' model cut, then refused (the window's V, D37).
    - pattern: '"message":"shell\.model_pull_failed"'
      level: error
      scenario: V
    # The settings name a provider that is no address.
    - pattern: '"message":"shell\.minutes_refused"'
      level: warning
      scenario: M
    # Tester, a service that refuses the key.
    - pattern: '"message":"shell\.test_failed"'
      level: error
      scenario: K
    # The played summary answers no minutes; the window's AA ends one a service writes, the meeting
    # said confidential (D60).
    - pattern: '"message":"shell\.minutes_failed"'
      level: error
      scenario: N
    # A command the page calls refused (D47): the window's AB corrects a transcript not complete.
    - pattern: '"message":"shell\.command_failed"'
      level: warning
      scenario: AB
    # A failure of the page's own, thrown then rejected; any other kind of the page's is not provoked.
    - pattern: '^(?=.*"message":"shell\.page_failed")(?=.*"kind":"ScenarioI")'
      level: error
      scenario: I

docs:
  readme: README.md
  agents: AGENTS.md
  adr: docs/adr/
  # runbook: docs/runbook.md     # required when criticality >= high
