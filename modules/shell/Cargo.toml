[package]
name = "summit-shell"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "summit"
path = "src/main.rs"

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
toml = "0.9"

[build-dependencies]
tauri-build = "2.7.2"

# The global shortcut: the desktop's portal on Linux, the system's own elsewhere (ADR-0002).
# A transcript ended with whatever it started: its process group (src/transcription.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3.34"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"

[dev-dependencies]
tempfile = "3"
