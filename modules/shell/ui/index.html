<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summit</title>
<link rel="stylesheet" href="window.css">
<script src="window.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" class="mark"></rect><path d="M12 46 L26 20 L37 40 M33 32 L40 24 L52 46" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" class="peaks"></path></svg>
    <span>Summit</span>
  </div>
  <nav id="sections"><a href="#/" id="meetings"></a><a href="#/settings" id="settings-link"></a></nav>
</header>
<main id="list">
  <section id="weight" class="card weight" aria-live="polite" hidden>
    <div class="total"><strong id="total"></strong> <span id="taken"></span></div>
    <div id="bar" class="split" role="img"><span id="bar-audio" class="audio"></span><span id="bar-text" class="text"></span></div>
    <ul class="legend">
      <li><span class="swatch audio" aria-hidden="true"></span><span id="audio-kept"></span></li>
      <li><span class="swatch text" aria-hidden="true"></span><span id="text-kept"></span></li>
    </ul>
  </section>
  <p id="none" class="none" hidden></p>
  <div id="groups"></div>
</main>
<main id="meeting" hidden></main>
<main id="settings" hidden></main>
<main id="agree" hidden></main>
</body>
</html>
