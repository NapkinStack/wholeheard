# Machine-readable source of truth for the module.
# Read by: humans (onboarding), agents (scoping), CI (fitness functions).
# Any divergence between this file and the code fails CI.

module:
  name: "install"

  # ONE sentence. If it needs an "and", the module probably does two things.
  responsibility: >
    Makes the package a user installs Wholeheard from, every program beside the shell.

  owner: "NapkinStack/maintainers"          # a GitHub team, organisation/team; a user only without an organisation
  contact: "@NapkinStack/maintainers"

  # proposed | active | maintenance | deprecated | retired   (.nstack/handbook/02-modules.md §6)
  lifecycle: active

  # What does a failure of this module cost? nothing, thrown away | a user's patience |
  # a day of work | a key, an order, money, personal data. The decider settles it; what
  # each value requires is the table in .nstack/handbook/05-workflow.md §7.
  # prototype | standard | high | critical
  criticality: "standard"

  # Does a user see this module? true requires a test sheet on its pull requests from
  # standard up (.nstack/handbook/05-workflow.md §7).
  user_facing: false

  # The module's name in the code, when it differs from the folder (package, namespace).
  # Used by boundary detection.
  # code_name: install

  # Only when lifecycle = deprecated. The check turns red once the date has passed.
  # deprecation:
  #   replaced_by:
  #   removal_date: YYYY-MM-DD

# Contracts PROVIDED by this module. `path` holds its document (B7).
provides: []
#  - contract: install-api
#    version: v1
#    path: contracts/install-api/v1
#    stability: experimental      # experimental | stable | deprecated
#    # removal_date: YYYY-MM-DD   # required when stability = deprecated

# Contracts CONSUMED - this is the DECLARED graph.
# CI compares it with the contracts this module's files read: one read and not declared
# fails (B1), one declared and never read is reported (B4), one nobody provides fails (B6).
consumes: []
#  - contract: identity-api
#    version: v1
#    module: identity

# Data owned. Nobody else accesses it directly.
# The modules whose release artefacts this one's release assembles (dist/<module>/).
assembles: [shell, capture, transcription, summary]

data:
  owns: []
  shared: []                     # any exception requires a named ADR

# Significant external dependencies.
# Each one declares its exit strategy (.nstack/handbook/06-decisions.md §3).
dependencies: []
#  - name:
#    purpose:
#    adr:
#    exit_strategy:

# Standard verbs: the same names everywhere, running this module's stack commands
# (.nstack/handbook/09-platform.md §2). `nstack <verb> <module>` runs them from this folder.
# No stack is imposed. check and test are required once the module holds more than its
# description (fitness M7): declare them before its first file of code.
commands:
  check: >-
    bash -n scripts/release.sh scripts/test.sh scripts/e2e.sh scripts/judge-installed.sh deb/build.sh mac/build.sh
    && python3 -m py_compile windows/build.py windows/msix.py
  test: bash scripts/test.sh
  e2e: bash scripts/e2e.sh
  release: bash scripts/release.sh
#  check:                        # under 2 min: format, lint, types
#  test:                         # NEVER starts another module
#  bootstrap:                    # optional: make the module usable from a fresh clone
#  run:                          # optional: local start, with doubles for the dependencies
#  e2e:                          # optional: end-to-end scenarios; evidence written to .evidence/
#  clean:                        # optional: remove what the commands above leave in this folder
#                                # (build outputs); CI runs it after every job on a self-hosted runner

docs:
  readme: README.md
  agents: AGENTS.md
  # runbook: docs/runbook.md     # required when criticality >= high
