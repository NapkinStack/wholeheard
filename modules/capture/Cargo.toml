[package]
name = "summit-capture"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
serde_json = "1.0.154"

# PipeWire is how a Linux desktop exposes what plays; the other systems need no feature.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }

[dev-dependencies]
tempfile = "3"
