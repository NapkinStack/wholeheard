[package]
name = "wholeheard-transcription"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rubato = "5.0.1"
serde_json = "1.0.154"
sonora = "0.2.0"
whisper-rs = "0.16.0"

# The graphics card, where the system has Vulkan and its headers: a tenth of the meeting's
# length on the laptop the engine was chosen on, against most of it on the processor (ADR-0003).
[features]
vulkan = ["whisper-rs/vulkan"]

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"

# The echo canceller, unoptimised, takes a minute over the half-minute a test gives it: built
# as for a user, it takes a second.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.sonora-aec3]
opt-level = 3
[profile.dev.package.sonora-common-audio]
opt-level = 3
[profile.dev.package.sonora-fft]
opt-level = 3
[profile.dev.package.sonora-simd]
opt-level = 3
