[package]
name = "summit-transcription"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rubato = "5.0.1"
serde_json = "1.0.154"
whisper-rs = "0.16.0"

# The graphics card, where the system has Vulkan and its headers: a tenth of the meeting's
# length on the laptop the engine was chosen on, against most of it on the processor (ADR-0003).
[features]
vulkan = ["whisper-rs/vulkan"]

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"
