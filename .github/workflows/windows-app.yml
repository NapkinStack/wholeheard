name: Windows app

# The zip a Windows colleague unpacks (D53), made by `nstack release` as on the Mac, judged, and kept
# 7 days on the run — a build for the project's colleagues, never a published one (cycle 04, the
# decider's answer of 2026-10-26). Built on main, on a pull request that changes install, which
# makes it, and on demand; never on every pull request — the Windows minutes spent where they say
# something, as the Mac's. What compiles is windows.yml's, on every change. Beside the zip, the
# package the Store takes (D54), signed for the run, tried and kept the same 7 days.

on:
  pull_request:
    paths:
      - "modules/install/**"
      - ".github/workflows/windows-app.yml"
  push:
    branches: [main]
    paths:
      - "modules/capture/**"
      - "modules/summary/**"
      - "modules/transcription/**"
      - "modules/shell/**"
      - "modules/install/**"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Windows — the zip and the package
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # The C and C++ runtime built into each program, whisper.cpp's included: nothing for the
      # colleague to install beside them.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: NapkinStack, the project version
        run: bash .nstack/install-engine.sh

      - name: Every program, then the zip
        run: nstack release

      # D53's first criterion, read on the zip a colleague downloads.
      - name: The zip, judged
        run: |
          zip=$(ls dist/install/Wholeheard-*-windows-x64.zip)
          python - "$zip" <<'PY'
          import sys, zipfile
          names = sorted(zipfile.ZipFile(sys.argv[1]).namelist())
          programs = ("wholeheard", "wholeheard-capture", "wholeheard-transcription", "wholeheard-summary")
          wanted = sorted(f"Wholeheard/{p}.exe" for p in programs)
          print(names)
          sys.exit(names != wanted)
          PY

      - name: The zip, kept for the colleagues
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wholeheard-windows-x64
          path: dist/install/Wholeheard-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      # D54's second criterion. The certificate is made in the script and thrown away with the runner.
      - name: The package, signed for the run, installed, upgraded and removed
        shell: pwsh
        timeout-minutes: 15
        run: modules/install/windows/trial.ps1 -Artefacts dist -Out dist/install

      # D77 probe: is the certification kit on the runner, does it run here, and what does its report hold?
      - name: "PROBE — the certification kit"
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $kit = 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe'
          Write-Output "kit at the default path: $(Test-Path $kit)"
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10' -Directory | ForEach-Object { $_.FullName }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter appcert.exe -ErrorAction Ignore |
            ForEach-Object { $_.FullName }
          $s = Get-Process -Id $PID
          Write-Output "session id: $($s.SessionId); interactive: $([Environment]::UserInteractive)"
          if (-not (Test-Path $kit)) { exit 0 }
          & $kit /? | Out-Host
          $package = (Get-ChildItem dist/install/Wholeheard-*-x64.msix | Select-Object -First 1).FullName
          Import-Certificate -FilePath dist/install/Wholeheard-this-run.cer `
            -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          New-Item -ItemType Directory -Force probe | Out-Null
          $report = Join-Path (Resolve-Path probe) 'appcert-report.xml'
          & $kit reset | Out-Host; Write-Output "reset exit: $LASTEXITCODE"
          & $kit test -appxpackagepath $package -reportoutputpath $report | Out-Host
          Write-Output "test exit: $LASTEXITCODE"
          Get-ChildItem probe | ForEach-Object { "$($_.Name) $($_.Length)" }
          if (Test-Path $report) { Get-Content $report -TotalCount 60 }

      - name: "PROBE — the kit's report, kept"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d77-probe-appcert
          path: probe/
          if-no-files-found: warn
          retention-days: 3

      - name: The package, kept for the colleagues
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wholeheard-windows-x64-msix
          path: |
            dist/install/Wholeheard-*-x64.msix
            dist/install/Wholeheard-this-run.cer
          if-no-files-found: error
          retention-days: 7
