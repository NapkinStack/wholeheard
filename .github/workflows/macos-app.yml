name: macOS app

# The app a Mac opens (D38), made by `nstack release` as on Fedora, judged, and kept 7 days on
# the run — a build for the project's colleagues, never a published one (cycle 04, the decider's
# answer of 2026-10-26). Built on main, where the colleagues' artifact comes from, on a pull
# request that changes install, which makes it, and on demand; never on every pull request — the
# macOS minutes spent where they say something (the decider, 2026-10-26: "il faut le faire avec
# parcimonie lorsque c'est utile uniquement"). What compiles is macos.yml's, on every change.

on:
  pull_request:
    paths:
      - "modules/install/**"
      - ".github/workflows/macos-app.yml"
  push:
    branches: [main]
    paths:
      - "modules/capture/**"
      - "modules/summary/**"
      - "modules/transcription/**"
      - "modules/shell/**"
      - "modules/install/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: macOS — the app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: NapkinStack, the project version
        run: bash .nstack/install-engine.sh

      - name: Every program, then the app
        run: nstack release

      # D38's first criterion, read on the zip a colleague downloads.
      - name: The app, judged
        run: |
          zip=$(ls dist/install/Wholeheard-*-macos-arm64.zip)
          unpacked=$(mktemp -d)
          ditto -x -k "$zip" "$unpacked"
          app=$unpacked/Wholeheard.app
          for program in wholeheard wholeheard-capture wholeheard-transcription wholeheard-speech wholeheard-summary; do
            test -x "$app/Contents/MacOS/$program"
          done
          read_key() { plutil -extract "$1" raw "$app/Contents/Info.plist"; }
          for key in CFBundleName NSMicrophoneUsageDescription NSAudioCaptureUsageDescription; do
            value=$(read_key "$key")
            test -n "$value"
            echo "$key: $value"
          done
          version=${zip##*/Wholeheard-}
          version=${version%-macos-arm64.zip}
          test "$(read_key CFBundleShortVersionString)" = "$version"
          test "$(read_key CFBundleExecutable)" = wholeheard
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q '^Signature=adhoc'

      - name: The app, kept for the colleagues
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wholeheard-macos-arm64
          path: dist/install/Wholeheard-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7
