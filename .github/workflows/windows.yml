name: Windows

# Whether each program builds on Windows, on GitHub's hosted runners: the first step of D53
# (cycle 04, the decider's word of 2026-10-27), before the zip a colleague opens and the Store's
# package (PDR-0004). It informs, it is not a required check: Windows is not yet a system the
# project ships to (charter).
#
# Run on a pull request that changes a program, on main, and on demand
# (Actions → Windows → Run workflow) — `--keep-going`: every target that does not build is said,
# not the first alone. The Windows minutes spent where they say something, as the
# Mac's (the decider, 2026-10-26: "il faut le faire avec parcimonie lorsque c'est utile uniquement").

on:
  pull_request:
    paths: &programs
      - "modules/capture/**"
      - "modules/summary/**"
      - "modules/transcription/**"
      - "modules/shell/**"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths: *programs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Windows — ${{ matrix.module }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [capture, summary, transcription, shell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo check
        working-directory: modules/${{ matrix.module }}
        run: cargo check --locked --all-targets --keep-going

      # D53's first criterion: each program's tests pass on Windows, not only build there.
      - name: cargo test
        working-directory: modules/${{ matrix.module }}
        run: cargo test --locked --no-fail-fast
