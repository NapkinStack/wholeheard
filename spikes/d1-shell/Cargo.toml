[package]
name = "d1-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"

[build-dependencies]
tauri-build = "2.7.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3.34"
